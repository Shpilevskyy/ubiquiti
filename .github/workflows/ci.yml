name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the server project's integration tests (tasks/23-testing.md step 6) need this — the
    # unit/web suites (steps 3-5) don't touch a database at all. POSTGRES_DB creates
    # ubiquiti_todo_test directly, matching apps/server's own local dev setup
    # (scripts/setup.sh) and vitest.config.ts's DATABASE_URL for the `server` project, both of
    # which use the same local-only, already-public credentials (not a secret).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ubiquiti
          POSTGRES_PASSWORD: ubiquiti
          POSTGRES_DB: ubiquiti_todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @ubiquiti-todo/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate test database
        working-directory: apps/server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ubiquiti:ubiquiti@localhost:5432/ubiquiti_todo_test

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # Checks formatting without writing, so drift fails CI instead of surfacing as a surprise
      # diff the next time someone runs `npm run format`.
      - name: Format check
        run: npm run format:check
